# vi keys in copy mode and at the command prompt
setw -g mode-keys vi
set  -g status-keys vi

# don't let tmux swallow <Esc> — this is the #1 cause of laggy Esc in nvim
set -sg escape-time 10

# so nvim's autoread / FocusGained work
set -g focus-events on

# proper colors for nvim
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# copy mode as visual mode
bind Escape copy-mode  # prefix + Esc -> "normal mode"
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle      # blockwise
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line
bind p paste-buffer  # prefix + p to put

# split like :vsplit / :split, and inherit the current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# navigate
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize (-r = repeatable, hold the key without re-pressing prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g prefix C-Space  # optional; C-b collides with vim's page-up
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1  # windows start at 1, like your nvim tabline probably does
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

